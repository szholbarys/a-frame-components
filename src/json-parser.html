<!DOCTYPE html>
<html>
  <head>
    <title>A-Frame JSON Config Parser</title>
    <link rel="stylesheet" href="styles/json-parser.css" />
    <link rel="stylesheet" href="styles/button.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="components/hover-scale.js"></script>
    <script src="components/color-cycle.js"></script>
    <script src="components/json-parser.js"></script>
    <script src="components/back-button.js"></script>
  </head>
  <body>
    <button id="back-button">Back</button>
    <input type="file" id="file-input" accept=".json" />
    <pre id="json-display"></pre>

    <a-scene>
      <a-entity id="configurable-entity"></a-entity>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="8"
        height="8"
        color="#7BC8A4"
      ></a-plane>
      <a-sky color="#1a1a1a"></a-sky>
    </a-scene>
  </body>
</html>
