<!DOCTYPE html>
<html>
  <head>
    <title>Game Demo</title>
    <link rel="stylesheet" href="../styles/button.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="../components/hover-scale.js"></script>
    <script src="../components/color-cycle.js"></script>
    <script src="../components/back-button.js"></script>
  </head>
  <body>
    <button id="back-button">Back</button>
    <a-scene>
      <a-entity id="targets" position="0 1.5 -4">
        <a-box
          class="target"
          position="-2 0 0"
          scale="0.5 0.5 0.5"
          hover-scale="scale: 1.2 1.2 1.2; duration: 200"
          color-cycle="colors: #FF5733, #33FF57; interval: 2000"
        >
        </a-box>
        <a-sphere
          class="target"
          position="0 0 0"
          radius="0.3"
          hover-scale="scale: 1.3 1.3 1.3; duration: 200"
          color-cycle="colors: #3357FF, #FF33F5; interval: 1500"
        >
        </a-sphere>
        <a-cylinder
          class="target"
          position="2 0 0"
          radius="0.3"
          height="0.8"
          hover-scale="scale: 1.2 1.2 1.2; duration: 200"
          color-cycle="colors: #FFD700, #FF4500; interval: 1800"
        >
        </a-cylinder>
      </a-entity>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#7BC8A4"
      >
      </a-plane>
      <a-sky color="#2A2A2A"></a-sky>
      <a-light type="ambient" color="#888"></a-light>
      <a-light type="point" intensity="1" position="2 4 4"></a-light>
    </a-scene>
  </body>
</html>
