<!DOCTYPE html>
<html>
  <head>
    <title>Interactive Scene Demo</title>
    <link rel="stylesheet" href="../styles/button.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="../components/hover-scale.js"></script>
    <script src="../components/color-cycle.js"></script>
    <script src="../components/back-button.js"></script>
  </head>
  <body>
    <button id="back-button">Back</button>
    <a-scene>
      <a-entity position="0 1.5 -4">
        <a-box
          position="0 0 0"
          rotation="0 45 0"
          scale="0.5 0.5 0.5"
          hover-scale="scale: 1.2 1.2 1.2; duration: 400"
          color-cycle="colors: #FF5733, #33FF57, #3357FF; interval: 1500"
          animation="property: rotation; to: 0 405 0; dur: 5000; easing: linear; loop: true"
        >
        </a-box>
        <a-entity
          animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"
        >
          <a-sphere position="1.5 0 0" radius="0.2" hover-scale color="#EF2D5E">
          </a-sphere>
          <a-sphere
            position="-1.5 0 0"
            radius="0.2"
            hover-scale
            color="#4CC3D9"
          >
          </a-sphere>
          <a-sphere position="0 0 1.5" radius="0.2" hover-scale color="#7BC8A4">
          </a-sphere>
          <a-sphere
            position="0 0 -1.5"
            radius="0.2"
            hover-scale
            color="#FFC65D"
          >
          </a-sphere>
        </a-entity>
      </a-entity>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="8"
        height="8"
        color="#7BC8A4"
        material="roughness: 0.8"
      >
      </a-plane>
      <a-sky color="#1A1A1A"></a-sky>
      <a-light type="ambient" color="#888"></a-light>
      <a-light type="point" intensity="1" position="2 4 4"></a-light>
    </a-scene>
  </body>
</html>
